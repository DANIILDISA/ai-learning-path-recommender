# Шесть направлений интерфейса -> реальная разметка каталога.
#
# Зачем файл вообще нужен. Шести направлений из макета («Цифровые технологии»,
# «Аналитика и данные», ...) в данных заказчика не существует. Есть 5 групп
# компетенций с канцелярскими названиями и 27 очень дробных подкатегорий,
# и то лишь у 97 программ из 161: у 64 электронных курсов реестра разметки
# нет вообще.
#
# Правило то же, что в aliases.yaml: здесь только то, что человек прочитал и
# подтвердил, никакого нечёткого совпадения по словам. Разница в цене ошибки:
# неверный интерес меняет ПОРЯДОК выдачи, а не идентичность курса, и инвариант
# приёмки сломать не может. Но тихо лишить человека выбранного им интереса
# она вполне способна.
#
# subgroups -- подкатегории буклета, как они записаны в programs.yaml.
#              Подкатегория может служить нескольким направлениям.
# courses    -- course_key электронных курсов, размеченных поимённо
#              (заполняется отдельной задачей).
#
# Подкатегории, намеренно не попавшие ни в одно направление: Городское
# хозяйство, Обеспечение безопасности, Экономика. Финансы, Правовые вопросы,
# Контроль и надзор, Критическое мышление, Саморегуляция и профилактика
# выгорания, Креативность, Общее, Общие. Они не ложатся ни в одно из шести
# названий, а придумывать седьмое направление за дизайнера мы не будем.

