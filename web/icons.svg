<svg xmlns="http://www.w3.org/2000/svg">
<!--
  Иконки интерфейса.

  В макете они набраны символами юникода. На Windows часть из них отсутствует
  в Inter: браузер подставляет их из системного шрифта другого размера, а
  некоторые рисует прямоугольником-заглушкой. Здесь тот же рисунок, но
  носитель обычный SVG, предсказуемый везде.

  Контуры без заливки; цвет и толщина наследуются от текста через
  currentColor (см. .icon в base.css). Одна иконка работает и синей в ссылке,
  и серой в строке метаданных.

  Идентификаторы названы по смыслу, а не по виду: clock, а не
  circle-with-hands. Заменить рисунок потом можно будет, не переименовывая
  места использования.

  Два правила, нарушение которых ломает файл молча, без ошибки в консоли:
  1. Никакого style="display:none" на корне. Приём годится для спрайта,
     вставленного в саму страницу; здесь файл внешний, и display:none
     наследуется в подключаемый символ, отчего на экране не появляется ничего.
  2. Никаких двойных дефисов в комментариях. XML их внутри комментария
     запрещает, файл перестаёт разбираться целиком, и все иконки исчезают
     разом. Есть тест test_sprite_is_valid_xml.
-->
  <symbol id="clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7v5l3 2"/>
  </symbol>

  <symbol id="tag" viewBox="0 0 24 24">
    <path d="M12 3 21 12l-9 9-9-9z"/>
  </symbol>

  <symbol id="spark" viewBox="0 0 24 24">
    <path d="M12 3v18M3 12h18M6 6l12 12M18 6 6 18"/>
  </symbol>

  <symbol id="circle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
  </symbol>

  <symbol id="target" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="3.5"/>
  </symbol>

  <symbol id="list" viewBox="0 0 24 24">
    <rect x="4" y="4" width="16" height="16" rx="2"/>
    <path d="M4 9.5h16M4 15h16"/>
  </symbol>

  <symbol id="chevron" viewBox="0 0 24 24">
    <path d="m6 9 6 6 6-6"/>
  </symbol>

  <symbol id="arrow-right" viewBox="0 0 24 24">
    <path d="M4 12h16M14 6l6 6-6 6"/>
  </symbol>

  <symbol id="check" viewBox="0 0 24 24">
    <path d="m5 12.5 5 5L19 7"/>
  </symbol>

  <symbol id="search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="m15.5 15.5 4.5 4.5"/>
  </symbol>

  <symbol id="person" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
  </symbol>

  <symbol id="bookmark" viewBox="0 0 24 24">
    <path d="M6 3.5h12v17l-6-4.5-6 4.5z"/>
  </symbol>
</svg>
