# Соответствие должностей группам должностей ГГС и трекам «Навигатора».
# Основание: 79-ФЗ делит должности на высшую/главную/ведущую/старшую/младшую
# группы; буклет группирует программы по «специалистам» и двум группам
# руководителей.
#
# Ключи -- нормализованные должности (через ingest.normalize.normalize_text:
# строчные, й/ё свёрнуты, без пунктуации).
#
# confirmed: false -- отнесение сделано нами по названию должности и НЕ
# подтверждено методистом заказчика. Такие строки работают как обычно, но
# перечисляются в отчёте (PositionIndex.unconfirmed()) как требующие
# подтверждения -- см. вопрос заказчику №4 в плане Фазы 3.
default_grade: specialist        # должность, которой нет в списке

positions:
  # --- специалисты ---
  "специалист 1 и категории":                                            {grade: specialist, confirmed: true}
  "специалист 1 и категории государственныи жилищныи инспектор санкт петербурга": {grade: specialist, confirmed: true}
  "специалист 1 и категории государственныи жилищныи нспеткор санкт петербурга":  {grade: specialist, confirmed: true}
  "специалист 1 и категории юрисконсульт":                               {grade: specialist, confirmed: true}
  "ведущии специалист":                                                  {grade: specialist, confirmed: true}
  "ведущии специалист юрисконсульт":                                     {grade: specialist, confirmed: true}
  "главныи специалист":                                                  {grade: specialist, confirmed: true}
  "главныи специалист комитета":                                         {grade: specialist, confirmed: true}
  "главныи специалист юрисконсульт":                                     {grade: specialist, confirmed: true}

  # --- руководители среднего звена (главная/ведущая группы) ---
  "начальник отдела":                                                    {grade: manager, confirmed: true}
  "начальник отдела главныи бухгалтер":                                  {grade: manager, confirmed: true}
  "начальник отдела государственныи жилищныи инспектор санкт петербурга": {grade: manager, confirmed: true}
  "начальник отдела государственныи инженер инспектор":                  {grade: manager, confirmed: true}
  "начальник сектора":                                                   {grade: manager, confirmed: true}
  "начальник управления":                                                {grade: manager, confirmed: true}
  "начальник управления ветеринарии санкт петербурга":                   {grade: manager, confirmed: true}
  "начальник управления главныи бухгалтер администрации губернатора санкт петербурга": {grade: manager, confirmed: true}
  "заместитель начальника отдела":                                       {grade: manager, confirmed: true}
  "заместитель начальника отдела зам главного бухгалтера":               {grade: manager, confirmed: true}
  "заместитель начальника отдела начальник сектора социальнои защиты ветеранов и инвалидов": {grade: manager, confirmed: true}
  "заместитель начальника управления начальник отдела":                  {grade: manager, confirmed: true}
  "заместитель начальника управления социального питания":               {grade: manager, confirmed: true}
  "заместитель начальника управления социального питания начальник отдела": {grade: manager, confirmed: true}
  # "инспекция" -- не отдел/сектор/управление; относим по общему правилу
  # "заместитель начальника*" -> manager, но должность не входит в 79-ФЗ
  # буквально в этом виде -- требует подтверждения методиста.
  "заместитель начальника инспекции заместитель главного государственного жилищного инспектора санкт петербурга": {grade: manager, confirmed: false}

  # --- высшая группа ---
  "заместитель главы администрации":                                     {grade: senior, confirmed: true}
  "заместитель председателя комитета":                                   {grade: senior, confirmed: true}
  "заместитель председателя комитета начальник управления":              {grade: senior, confirmed: true}
  "первыи заместитель председателя комитета":                            {grade: senior, confirmed: true}
  "председатель комитета":                                               {grade: senior, confirmed: true}
  # "первый заместитель начальника службы/инспекции" -- неясно, поднимает
  # ли "первый" должность до высшей группы или она остаётся руководителем
  # среднего звена; требует подтверждения методиста.
  "первыи заместитель начальника службы":                                {grade: senior, confirmed: false}
  "первыи заместитель начальника инспекции заместитель главного государственного инженера инспектора": {grade: senior, confirmed: false}
