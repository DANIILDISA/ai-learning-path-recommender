# Написания названий программ, подтверждённые выгрузками заказчика.
#
# Зачем файл. PDF-буклет при извлечении текста местами склеивает слова
# («Интенсивпо языковой грамотности»), а в выгрузке истории то же название
# написано правильно. Импортёр буклета (catalog/import_booklet.py) и загрузчик
# каталога (catalog/programs.py) сверяют названия с этим списком и с
# названиями из самой выгрузки и восстанавливают пробелы, если написания
# отличаются ТОЛЬКО пробелами. Больше ничего не меняется.
#
# ПРАВИЛО: сюда вносится только написание, которое человек прочитал в
# выгрузке заказчика. Догадка здесь испортила бы настоящее слово.
spellings:
  - "Интенсив по языковой грамотности"
