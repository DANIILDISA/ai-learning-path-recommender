# Конфигурация ИИ-агента индивидуальной траектории обучения.
# Ничего из перечисленного здесь не должно быть захардкожено в Python.

# Файлы и листы теперь ищутся по СОДЕРЖИМОМУ (ingest/smart_table.py), а не по
# имени. Три значения ниже -- лишь подсказки на случай, когда подходящих
# таблиц несколько: предпочесть файл с таким началом имени / лист с таким именем.
data:
  history_prefix: "выгрузка"
  registry_prefix: "Реестр"
  history_sheet: "ГГС 2024-2025"

catalog:
  aliases_file: "aliases.yaml"
  # Нечёткая связь названий курсов из истории с каталогом: ниже порога -- не связываем.
  fuzzy_threshold: 0.95

# Группа моделей: russian | foreign | local.
# Переключение группы -- правка этой строки, не кода.
llm:
  model_group: "russian"
  temperature: 0.0
  cache_enabled: true
  timeout_seconds: 60
  # Отключает LLM целиком: трек строится детерминированным движком Фазы 3.
  enabled: true
  groups:
    russian:
      client: gigachat
      # Замер 2026-08-23, тот же срез (10 профилей, 2 повтора, кэш отключён):
      #   модель            JSON   в пуле  воспроизв.  медиана
      #   GigaChat (Lite)    90%     45%      40%       4.97 с
      #   GigaChat-Pro      100%     60%      30%      12.78 с
      #   GigaChat-Max      100%     80%      40%      12.49 с   <- выбрано
      #   GigaChat-2-Max    100%     75%      20%      13.94 с
      #
      # Прежний вывод («старшие модели ничего не дают, платить не за что»)
      # опровергнут. Он опирался на проверку 14 августа, которая смотрела
      # порядок, валидность JSON и качество текста, но НЕ мерила долю ответов
      # в пределах выданного пула -- ровно ту метрику, где разница
      # оказалась двукратной.
      #
      # Max выбран по дисциплине следования пулу: 80% против 45% у Lite.
      # Плата -- скорость: 12.5 с против 5 с. Для продукта это приемлемо,
      # ответы кэшируются, а выдуманный курс дороже ожидания.
      #
      # Воспроизводимость плоха у всех четырёх (20-40% против 100% у
      # зарубежной группы). Это свойство семейства, а не тарифа, и самая
      # новая модель здесь худшая. Смягчается кэшем; заказчику сказано.
      #
      # Финал (09.10): основной сервер -- api.giga.chat, модель по умолчанию --
      # самая сильная, GigaChat-3-Ultra (живёт только на новом сервере). При
      # ошибке или недоступности клиент сам переходит по цепочке
      # fallback_models, а при обрыве связи -- на старый сервер из
      # fallback_base_urls. Доступные имена: GigaChat-2 (Lite), GigaChat-2-Pro,
      # GigaChat-2-Max, GigaChat-3-Ultra, GigaChat-3-Pro, GigaChat-3-Lightning.
      # Замер из комментария выше относится к прежним именам и подлежит
      # повторению (этап 7 плана).
      model: GigaChat-3-Ultra
      base_url: https://api.giga.chat/v1
      fallback_base_urls: [https://gigachat.devices.sberbank.ru/api/v1]
      fallback_models: [GigaChat-3-Pro, GigaChat-2-Pro]
      retries: 3
      retry_backoff_seconds: 1.0
      api_key_env: GIGACHAT_CREDENTIALS
      scope_env: GIGACHAT_SCOPE
      verify_ssl: false
      max_tokens: 1024
    foreign:
      client: openai_compat
      base_url: https://openrouter.ai/api/v1
      # Замер 2026-08-14 на нашей задаче (переранжировать 15 кандидатов +
      # написать обоснования по-русски), стоимость — прогон всех 323 профилей:
      #   google/gemini-2.5-flash-lite  1.5 с  $0.041   <- выбрано
      #   openai/gpt-4o-mini            4.3 с  $0.057
      #   deepseek/deepseek-chat        5.5 с  $0.108
      # Все три вернули валидный JSON и одинаковый порядок; выбор по скорости
      # и цене при сопоставимом качестве русского текста.
      model: google/gemini-2.5-flash-lite
      api_key_env: OPENROUTER_API_KEY
      max_tokens: 1024
    local:
      client: openai_compat
      base_url: http://localhost:11434/v1
      model: qwen2.5:7b
      api_key_env: LOCAL_LLM_API_KEY   # обычно не требуется
      max_tokens: 1024
      # Локальный режим не входит в коробочную поставку: модель весит
      # гигабайты и требует отдельно установленного сервера, что
      # несовместимо с запуском распаковкой архива.
      shipped: false

benchmark:
  # Срез профилей, а не весь корпус: прогон 323 профилей через три группы
  # стоит денег и времени, а разброс метрик виден уже на десятке.
  sample_size: 10
  # Фиксированный отбор, чтобы сравнение между группами шло по одним и тем же людям
  # и было воспроизводимым между запусками.
  sample_seed: 20260814
  # Повторов для проверки воспроизводимости (критерий приёмки).
  repeats: 2
  groups: [russian, foreign, local]

track:
  max_recommendations: 10
  weights:
    navigator_track: 3.0      # программа в треке, соответствующем должности
    peer_completion: 2.0      # умножается на долю коллег, прошедших курс
    same_iogv_bonus: 0.5      # коллеги из своего ИОГВ прошли курс
    competency_gap: 1.5       # компетенционная группа, которой у человека мало
    unfinished_restart: 1.0   # курс со статусом «не пройден» -- мягкое возвращение
    # Ответы мастера настройки. Все четыре -- МЯГКИЕ веса внутри уже
    # допустимого пула: они переставляют выдачу, но не могут внести в неё
    # курс, которого фильтр допустимости туда не пустил.
    interest_match: 2.0       # курс попал в выбранное направление (шаг 3)
    picked_course: 2.5        # человек сам отметил программу (шаг 4)
    goal_match: 1.0           # группа компетенций отвечает заявленной цели (шаг 1)
    urgency_match: 1.0        # трудоёмкость и формат подходят заявленному сроку (шаг 2)
    # Отметки на карточках подборки больше весами не выражаются: любая
    # отмеченная программа уходит из подборки в «Моё обучение», а на её место
    # встаёт следующая (см. `engine.track.build_track`). Веса остались для
    # `score_course`, куда отметку по-прежнему можно передать явно.
    feedback_want: 3.0
    feedback_later: -2.0
    # Электронный курс того же направления интересов, что уже пройденный курс
    # (явная разметка interests.yaml): единственный тематический сигнал,
    # который у курсов реестра есть.
    topic_match: 1.0
  preferences:
    # Соответствие «цель -> группы компетенций» -- НАШЕ ДОПУЩЕНИЕ, а не данные
    # заказчика. Вынесено сюда именно поэтому: чтобы методист мог прочитать
    # его и оспорить, не читая Python. См. вопрос 2 в дизайн-спеке фазы 8.
    goal_competency_groups:
      career_growth: ["Инструменты управления", "Личностные компетенции"]
      current_role: ["Профильные hard-skills", "Профессиональные компетенции"]
      new_field: ["Базовые компетенции", "Личностные компетенции"]
      undecided: []
    # Что считать «быстрой» программой для срочности «в течение 3 месяцев».
    # Медиана трудоёмкости по каталогу -- 28 часов, максимум -- 520.
    quick_hours_max: 40
  max_per_competency_group: 3
  # Порог, ниже которого доля коллег не показывается пользователю как
  # обоснование (в балл она входит всегда). «100% коллег» при когорте из
  # одного человека — формально правда, но читается как сильное социальное
  # доказательство, которым не является.
  min_peer_cohort: 5
  min_peer_share: 0.05
